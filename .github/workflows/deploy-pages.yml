# 작성: 2026-09-24 17:50 KST
# web_version 폴더를 GitHub Pages로 배포합니다.
# 저장소 Settings > Pages > Source를 "GitHub Actions"로 한 번 설정해야 동작합니다.
name: Deploy web_version to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web_version/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web_version
      - id: deployment
        uses: actions/deploy-pages@v4
