<!DOCTYPE html>

<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>손글씨 숫자 인식기</title>
  <link rel="stylesheet" href="스타일.css">
</head>
<body>
  <!-- 페이지 맨 위: 학번과 이름 (과제 요구사항이므로 지우지 않습니다) -->
  <header class="학생정보">학번 2601953 이름 안서연</header>
  <main>
    <h1>손글씨 숫자 인식기</h1>
    <p class="안내">그림판에 0~9 숫자 하나를 크게 그려 보세요. 붓을 떼면 인식합니다.</p>
    <div class="작업영역">
      <section class="그림판영역">
        <canvas id="그림판" width="280" height="280" aria-label="숫자를 그리는 그림판"></canvas>
        <button id="지우기" type="button">지우기</button>
      </section>
      <section class="결과영역">
        <div id="예측" class="예측">?</div>
        <div id="신뢰도" class="신뢰도">모델을 불러오는 중…</div>
        <div id="막대목록"></div>
      </section>
    </div>
  </main>
  <script src="전처리.js"></script>
  <script src="모델.js"></script>
  <script src="그림판.js"></script>
  <script src="앱.js"></script>
</body>
</html>
