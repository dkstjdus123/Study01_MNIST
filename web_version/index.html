<!DOCTYPE html>

<!-- 손글씨 숫자 인식기 (웹 버전): 외부 라이브러리 없이 순수 자바스크립트로 추론하며, GitHub Pages에 정적 파일로 올립니다. -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>손글씨 숫자 인식기</title>
<link rel="stylesheet" href="스타일.css">
</head>
<body>
  <!-- 페이지 맨 위: 학번과 이름 (과제 요구사항이므로 지우지 않습니다) -->
  <header class="학생정보">학번 2601953 이름 안서연</header>

  <main>
    <h1>손글씨 숫자 인식기</h1>
    <p class="설명">검은 칸에 0~9 숫자를 그리면 PyTorch로 학습한 CNN을 외부 라이브러리 없이 순수 자바스크립트로 계산해 브라우저 안에서 바로 인식합니다.</p>

    <div class="본문">
      <section class="카드 그림판영역">
        <canvas id="그림판" width="280" height="280"></canvas>
        <button id="지우기">지우기</button>
      </section>
      <section class="카드 결과영역">
        <div class="예측" id="예측">?</div>
        <div class="신뢰도" id="신뢰도">모델을 불러오는 중…</div>
        <div id="막대목록"></div>
      </section>
    </div>
  </main>

  <!-- 순서: 그림판(그리기) → 전처리(MNIST 형식 변환) → 모델(가중치 적재 + 순전파) → 앱(엮어서 결과 표시) -->
  <script src="그림판.js"></script>
  <script src="전처리.js"></script>
  <script src="모델.js"></script>
  <script src="앱.js"></script>
</body>
</html>
