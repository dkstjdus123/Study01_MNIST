<!DOCTYPE html>
<!-- 작성: 2026-09-24 19:25 (수정: 2026-09-24 19:37 전처리 null 처리, 전개 연산자 제거, 표본 종류별 집계) -->
<!--
  파이썬(데스크톱 버전) 결과와 웹 버전 결과를 대조하는 검증 페이지입니다.
  먼저 python desktop_version/검증데이터만들기.py 로 검증데이터.json/.bin을 만든 뒤,
  저장소 루트에서 python -m http.server 8000 을 실행하고 http://localhost:8000/web_version/검증.html 을 엽니다.
  검증 데이터는 저장소에 올리지 않으므로 GitHub Pages에서는 "검증 데이터가 없습니다"라고 나옵니다.
-->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>웹 버전 검증</title>
<link rel="stylesheet" href="스타일.css">
</head>
<body>
  <header class="학생정보">학번 2601953 이름 안서연</header>
  <main>
    <h1>웹 버전 검증</h1>
    <p class="설명">MNIST 테스트 이미지(크기·위치를 여러 가지로 바꿈)와 app.py 방식으로 획을 그린 그림을 파이썬(app.py 전처리 + PyTorch)과 자바스크립트(전처리.js + 모델.js)로 각각 처리해 결과를 대조합니다.</p>
    <section class="카드">
      <div class="요약" id="요약">검증 중…</div>
      <table>
        <thead><tr><th>번호</th><th>종류</th><th>정답</th><th>파이썬 예측</th><th>JS 예측</th><th>전처리 최대 차이</th><th>점수 최대 차이</th></tr></thead>
        <tbody id="결과표"></tbody>
      </table>
    </section>
  </main>

  <script src="전처리.js"></script>
  <script src="모델.js"></script>
  <script>
  (async function () {
    "use strict";
    const 요약 = document.getElementById("요약");
    const 결과표 = document.getElementById("결과표");
    const 최대위치 = 배열 => { let 위치 = 0; for (let i = 1; i < 배열.length; i++) if (배열[i] > 배열[위치]) 위치 = i; return 위치; };

    let 불러온모델, 검증, 그림들;
    try {
      불러온모델 = await 모델.모델_불러오기();
      const [정보응답, 그림응답] = await Promise.all([fetch("검증데이터.json"), fetch("검증데이터.bin")]);
      if (!정보응답.ok || !그림응답.ok) throw new Error("검증 데이터가 없습니다. python desktop_version/검증데이터만들기.py 를 먼저 실행하세요.");
      검증 = await 정보응답.json();
      그림들 = new Uint8Array(await 그림응답.arrayBuffer());
    } catch (오류) {
      요약.innerHTML = `<span class="실패">${오류.message}</span>`;
      return;
    }

    const 면적 = 검증.가로 * 검증.세로;
    const 종류목록 = 검증.종류 || new Array(검증.장수).fill("MNIST");
    let 전처리일치 = 0, 예측일치 = 0, JS맞음 = 0, 파이썬맞음 = 0, 최대입력차 = 0, 최대점수차 = 0, 총시간 = 0;
    const 종류별 = {};   // 종류 → { 장수, JS맞음, 파이썬맞음, 예측일치 }
    const 줄들 = [];
    for (let i = 0; i < 검증.장수; i++) {
      const 종류 = 종류목록[i], 정답 = 검증.정답[i];
      const 시작 = performance.now();
      const 입력 = 전처리.전처리하기(그림들.subarray(i * 면적, (i + 1) * 면적), 검증.가로, 검증.세로,
                                    불러온모델.평균, 불러온모델.표준편차);
      const 점수 = 입력 ? Array.from(불러온모델.추론(입력)) : null;
      총시간 += performance.now() - 시작;

      // 한쪽만 빈 그림(null)으로 판단하면 불일치로 셉니다. 둘 다 null이면 일치입니다.
      const 파이썬입력 = 검증.파이썬입력[i], 파이썬점수 = 검증.파이썬점수[i];
      let 입력차 = 0, 점수차 = 0;
      if (입력 && 파이썬입력) {
        for (let k = 0; k < 784; k++) 입력차 = Math.max(입력차, Math.abs(입력[k] - 파이썬입력[k]));
        for (let k = 0; k < 10; k++) 점수차 = Math.max(점수차, Math.abs(점수[k] - 파이썬점수[k]));
      } else if (입력 || 파이썬입력) {
        입력차 = 점수차 = Infinity;
      }
      const JS예측 = 점수 ? 최대위치(점수) : "없음", 파이썬예측 = 파이썬점수 ? 최대위치(파이썬점수) : "없음";

      const 집계 = 종류별[종류] || (종류별[종류] = { 장수: 0, JS맞음: 0, 파이썬맞음: 0, 예측일치: 0 });
      집계.장수++;
      if (입력차 < 1e-4) 전처리일치++;
      if (JS예측 === 파이썬예측) { 예측일치++; 집계.예측일치++; }
      if (JS예측 === 정답) { JS맞음++; 집계.JS맞음++; }
      if (파이썬예측 === 정답) { 파이썬맞음++; 집계.파이썬맞음++; }
      최대입력차 = Math.max(최대입력차, 입력차);
      최대점수차 = Math.max(최대점수차, 점수차);
      const 불일치 = JS예측 !== 파이썬예측 || !(입력차 < 1e-4);
      줄들.push(`<tr class="${불일치 ? "불일치" : ""}"><td>${i}</td><td>${종류}</td><td>${정답}</td><td>${파이썬예측}</td><td>${JS예측}</td>` +
                `<td>${입력차.toExponential(1)}</td><td>${점수차.toExponential(1)}</td></tr>`);
    }
    결과표.innerHTML = 줄들.join("");

    const n = 검증.장수, 통과 = 예측일치 === n && 전처리일치 === n;
    const 종류요약 = Object.entries(종류별).map(([종류, 집계]) =>
      `· ${종류} ${집계.장수}장: 예측 일치 ${집계.예측일치}/${집계.장수}, 정확도 JS ${집계.JS맞음} / 파이썬 ${집계.파이썬맞음}`).join("<br>");
    요약.innerHTML =
      `<span class="${통과 ? "통과" : "실패"}">${통과 ? "통과" : "불일치 있음"}</span> — ${n}장 검증<br>` +
      `전처리 결과가 파이썬과 같음 (차이 1e-4 미만): ${전처리일치}/${n} (최대 차이 ${최대입력차.toExponential(2)})<br>` +
      `예측이 파이썬과 같음: ${예측일치}/${n} (점수 최대 차이 ${최대점수차.toExponential(2)})<br>` +
      `정확도: 자바스크립트 ${JS맞음}/${n}, 파이썬 ${파이썬맞음}/${n}<br>` +
      `${종류요약}<br>` +
      `한 장 처리 시간(전처리 + 추론): 평균 ${(총시간 / n).toFixed(1)}ms`;
  })();
  </script>
</body>
</html>
