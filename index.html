<!DOCTYPE html>
<!-- 작성: 2026-09-22 02:12 -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>손글씨 숫자 인식기</title>
<style>
  /* 색상 변수: 밝은 화면 */
  :root {
    --배경: #f6f7f9; --카드: #ffffff; --글자: #1f2328; --흐린글자: #656d76;
    --강조: #1a73e8; --막대: #c9d1d9; --테두리: #d0d7de; --머리배경: #1a73e8; --머리글자: #ffffff;
  }
  /* 어두운 화면 */
  @media (prefers-color-scheme: dark) {
    :root {
      --배경: #0d1117; --카드: #161b22; --글자: #e6edf3; --흐린글자: #8d96a0;
      --강조: #58a6ff; --막대: #30363d; --테두리: #30363d; --머리배경: #1f3a5f; --머리글자: #ffffff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--배경); color: var(--글자);
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  }
  /* 맨 위 학번·이름 표시줄 */
  .학생정보 {
    background: var(--머리배경); color: var(--머리글자);
    text-align: center; padding: 14px 16px; font-size: 20px; font-weight: 700; letter-spacing: 0.02em;
  }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .설명 { color: var(--흐린글자); margin: 0 0 20px; }
  .본문 { display: flex; gap: 24px; flex-wrap: wrap; }
  .카드 {
    background: var(--카드); border: 1px solid var(--테두리); border-radius: 12px; padding: 16px;
  }
  .그림판영역 { flex: 0 1 312px; }
  canvas#그림판 {
    display: block; width: 100%; max-width: 280px; aspect-ratio: 1; margin: 0 auto;
    background: #000; border-radius: 8px; touch-action: none; cursor: crosshair;
  }
  button {
    display: block; margin: 12px auto 0; padding: 8px 28px; font: inherit; font-size: 15px;
    background: var(--카드); color: var(--글자); border: 1px solid var(--테두리); border-radius: 8px; cursor: pointer;
  }
  button:hover { border-color: var(--강조); }
  .결과영역 { flex: 1 1 260px; }
  .예측 { font-size: 72px; font-weight: 700; color: var(--강조); text-align: center; line-height: 1.1; }
  .신뢰도 { text-align: center; color: var(--흐린글자); margin-bottom: 12px; min-height: 1.4em; }
  .막대줄 { display: grid; grid-template-columns: 16px 1fr 52px; align-items: center; gap: 8px; margin: 4px 0; font-size: 14px; }
  .막대틀 { height: 12px; background: var(--배경); border-radius: 6px; overflow: hidden; }
  .막대 { height: 100%; width: 0; background: var(--막대); transition: width 0.15s; }
  .막대.최대 { background: var(--강조); }
  .퍼센트 { text-align: right; font-variant-numeric: tabular-nums; color: var(--흐린글자); }
</style>
</head>
<body>
  <!-- 페이지 맨 위: 학번과 이름 -->
  <header class="학생정보">학번 2601953 이름 안서연</header>

  <main>
    <h1>손글씨 숫자 인식기</h1>
    <p class="설명">검은 칸에 0~9 숫자를 그리면 PyTorch로 학습한 CNN이 브라우저 안에서 바로 인식합니다.</p>

    <div class="본문">
      <section class="카드 그림판영역">
        <canvas id="그림판" width="280" height="280"></canvas>
        <button id="지우기">지우기</button>
      </section>
      <section class="카드 결과영역">
        <div class="예측" id="예측">?</div>
        <div class="신뢰도" id="신뢰도">모델을 불러오는 중…</div>
        <div id="막대목록"></div>
      </section>
    </div>
  </main>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
<script>
  // ===== 설정 (app.py와 같은 값) =====
  const 펜두께 = 18;
  const 평균 = 0.1307, 표준편차 = 0.3081;

  const 그림판 = document.getElementById("그림판");
  const 붓 = 그림판.getContext("2d");
  const 예측표시 = document.getElementById("예측");
  const 신뢰도표시 = document.getElementById("신뢰도");
  const 막대목록 = document.getElementById("막대목록");
  let 세션 = null;
  let 그리는중 = false, 이전좌표 = null;

  // 0~9 확률 막대를 만듭니다.
  const 막대들 = [], 퍼센트들 = [];
  for (let 숫자 = 0; 숫자 < 10; 숫자++) {
    const 줄 = document.createElement("div");
    줄.className = "막대줄";
    줄.innerHTML = `<span>${숫자}</span><div class="막대틀"><div class="막대"></div></div><span class="퍼센트">0.0%</span>`;
    막대목록.appendChild(줄);
    막대들.push(줄.querySelector(".막대"));
    퍼센트들.push(줄.querySelector(".퍼센트"));
  }

  // 그림판을 검은색으로 초기화합니다. (MNIST처럼 검은 배경에 흰 글씨)
  function 지우기() {
    붓.fillStyle = "#000";
    붓.fillRect(0, 0, 그림판.width, 그림판.height);
    예측표시.textContent = "?";
    if (세션) 신뢰도표시.textContent = "숫자를 그려 보세요";
    막대_갱신(new Array(10).fill(0));
  }

  // 화면 좌표를 캔버스 내부 좌표(280x280)로 바꿉니다.
  function 캔버스좌표(이벤트) {
    const 영역 = 그림판.getBoundingClientRect();
    return [(이벤트.clientX - 영역.left) * 그림판.width / 영역.width,
            (이벤트.clientY - 영역.top) * 그림판.height / 영역.height];
  }

  function 선긋기(좌표) {
    붓.strokeStyle = "#fff"; 붓.fillStyle = "#fff";
    붓.lineWidth = 펜두께; 붓.lineCap = "round"; 붓.lineJoin = "round";
    if (이전좌표) {
      붓.beginPath(); 붓.moveTo(...이전좌표); 붓.lineTo(...좌표); 붓.stroke();
    }
    붓.beginPath(); 붓.arc(좌표[0], 좌표[1], 펜두께 / 2, 0, Math.PI * 2); 붓.fill();
    이전좌표 = 좌표;
  }

  // 마우스와 터치를 모두 처리하도록 포인터 이벤트를 사용합니다.
  그림판.addEventListener("pointerdown", e => { 그리는중 = true; 그림판.setPointerCapture(e.pointerId); 선긋기(캔버스좌표(e)); });
  그림판.addEventListener("pointermove", e => { if (그리는중) 선긋기(캔버스좌표(e)); });
  function 붓떼기() { if (!그리는중) return; 그리는중 = false; 이전좌표 = null; 인식하기(); }
  그림판.addEventListener("pointerup", 붓떼기);
  그림판.addEventListener("pointercancel", 붓떼기);
  document.getElementById("지우기").addEventListener("click", 지우기);

  /**
   * 그림을 MNIST 형식으로 바꿉니다. (app.py의 전처리와 같은 순서)
   * 글씨 영역 잘라내기 → 긴 변을 20px로 축소 → 28x28 가운데 배치 → 무게중심을 (14,14)로 이동 → 정규화
   */
  function 전처리() {
    const { width: 가로, height: 세로 } = 그림판;
    const 픽셀 = 붓.getImageData(0, 0, 가로, 세로).data;
    let 왼 = 가로, 위 = 세로, 오른 = -1, 아래 = -1;
    for (let y = 0; y < 세로; y++) for (let x = 0; x < 가로; x++) {
      if (픽셀[(y * 가로 + x) * 4] > 0) {
        if (x < 왼) 왼 = x; if (x > 오른) 오른 = x;
        if (y < 위) 위 = y; if (y > 아래) 아래 = y;
      }
    }
    if (오른 < 0) return null;   // 아무것도 그리지 않음

    const 너비 = 오른 - 왼 + 1, 높이 = 아래 - 위 + 1;
    const 배율 = 20 / Math.max(너비, 높이);
    const 새너비 = Math.max(1, Math.round(너비 * 배율)), 새높이 = Math.max(1, Math.round(높이 * 배율));

    const 작은판 = document.createElement("canvas");
    작은판.width = 28; 작은판.height = 28;
    const 작은붓 = 작은판.getContext("2d");
    작은붓.fillStyle = "#000"; 작은붓.fillRect(0, 0, 28, 28);
    작은붓.imageSmoothingEnabled = true; 작은붓.imageSmoothingQuality = "high";
    작은붓.drawImage(그림판, 왼, 위, 너비, 높이,
                     Math.floor((28 - 새너비) / 2), Math.floor((28 - 새높이) / 2), 새너비, 새높이);

    // 밝기(0~1)와 무게중심을 구합니다.
    const 작은픽셀 = 작은붓.getImageData(0, 0, 28, 28).data;
    const 밝기 = new Float32Array(28 * 28);
    let 합 = 0, 중심x = 0, 중심y = 0;
    for (let i = 0; i < 28 * 28; i++) {
      const v = 작은픽셀[i * 4] / 255;
      밝기[i] = v; 합 += v; 중심x += (i % 28) * v; 중심y += Math.floor(i / 28) * v;
    }
    const 이동x = Math.round(14 - 중심x / 합), 이동y = Math.round(14 - 중심y / 합);

    // 무게중심이 가운데 오도록 옮긴 뒤 학습 때와 같이 정규화합니다.
    const 입력 = new Float32Array(28 * 28).fill((0 - 평균) / 표준편차);
    for (let y = 0; y < 28; y++) for (let x = 0; x < 28; x++) {
      const 새x = x + 이동x, 새y = y + 이동y;
      if (새x >= 0 && 새x < 28 && 새y >= 0 && 새y < 28)
        입력[새y * 28 + 새x] = (밝기[y * 28 + x] - 평균) / 표준편차;
    }
    return 입력;
  }

  async function 인식하기() {
    if (!세션) return;
    const 입력 = 전처리();
    if (!입력) return;
    const 결과 = await 세션.run({ input: new ort.Tensor("float32", 입력, [1, 1, 28, 28]) });
    const 점수 = Array.from(결과.logits.data);
    // 소프트맥스로 확률을 계산합니다.
    const 최대점수 = Math.max(...점수);
    const 지수 = 점수.map(s => Math.exp(s - 최대점수));
    const 합 = 지수.reduce((a, b) => a + b, 0);
    const 확률 = 지수.map(v => v / 합);
    const 예측 = 확률.indexOf(Math.max(...확률));
    예측표시.textContent = 예측;
    신뢰도표시.textContent = `신뢰도: ${(확률[예측] * 100).toFixed(1)}%`;
    막대_갱신(확률);
  }

  function 막대_갱신(확률) {
    const 최대 = 확률.some(p => p > 0) ? 확률.indexOf(Math.max(...확률)) : -1;
    확률.forEach((p, 숫자) => {
      막대들[숫자].style.width = `${p * 100}%`;
      막대들[숫자].classList.toggle("최대", 숫자 === 최대);
      퍼센트들[숫자].textContent = `${(p * 100).toFixed(1)}%`;
    });
  }

  // 모델을 불러옵니다.
  지우기();
  ort.InferenceSession.create("mnist_cnn.onnx")
    .then(s => { 세션 = s; 신뢰도표시.textContent = "숫자를 그려 보세요"; })
    .catch(e => { 신뢰도표시.textContent = "모델을 불러오지 못했습니다: " + e.message; });
</script>
</body>
</html>
